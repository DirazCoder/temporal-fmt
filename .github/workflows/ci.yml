name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Node versions x OSes. The OS axis exists because smoke-test/
      # (real npm pack + install + require/import) broke three separate
      # ways on Windows (ENOENT, EINVAL, DEP0190) that ubuntu-only CI
      # never caught — those were only found by a person running it
      # locally on Windows, which isn't something CI should depend on.
      matrix:
        node-version: [20, 22, 24, 26]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm run test:all -- --no-browser

  browser-smoke:
    name: Playwright ${{ matrix.browser }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm install --no-save @playwright/test@latest
      - run: npm run build

      - name: Install Playwright browser and system dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright browser
        if: runner.os != 'Linux'
        run: npx playwright install ${{ matrix.browser }}

      - name: Run full Vitest suite in browser
        env:
          VITEST_BROWSER: ${{ matrix.browser }}
        run: npm run test:browser:unit

      - run: npm run test:browser -- --project=${{ matrix.browser }}