name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'package.json'
      - 'README.md'
      - '.github/workflows/website-deployer.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install website dependencies
        run: npm ci
        working-directory: website

      - name: Build the site
        run: node build.js
        working-directory: website

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/public

      - id: deployment
        uses: actions/deploy-pages@v4
