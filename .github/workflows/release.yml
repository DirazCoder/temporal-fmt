name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC token verification on npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm --version

      - run: npm ci

      # Fails fast if the git tag doesn't match package.json to prevent mismatched releases
      - name: Verify tag matches package.json version
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "Manual trigger detected on branch: ${GITHUB_REF}. Skipping tag matching verification."
            exit 0
          fi

          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm run test:all

      # npm publish (below) triggers prepublishOnly automatically, which
      # rebuilds dist/ with minification on and reruns the functional
      # tests against that build — a separate rebuild from the
      # unminified one test:all just checked. Coverage isn't re-verified
      # against the minified build; test:all above is the real
      # correctness/coverage gate, and prepublishOnly's job is only to
      # catch "did minification break something at runtime" before it
      # ships. See tsup.config.ts for why coverage requires unminified
      # output.
      #
      # The step below rebuilds minified explicitly (rather than relying
      # on prepublishOnly's implicit rebuild during npm publish) so a
      # broken minification config fails CI here, before publishing,
      # instead of silently shipping an unminified — or partially built
      # — tarball. If TSUP_MINIFY gets removed from build:publish, or
      # tsup's minify option stops working, this step catches it.
      - run: npm run build:publish

      - name: Verify the published build is actually minified
        run: |
          if grep -rlq "function safeParse" dist/chunk-*.js 2>/dev/null; then
            echo "dist/ still has readable function names — minification didn't run."
            echo "Check TSUP_MINIFY is set in build:publish (package.json) and that"
            echo "tsup.config.ts's minify option still reads it correctly."
            exit 1
          fi

      # Sets 'latest' for main branch builds and tagged LTS tags for older release branches
      - name: Determine npm dist-tag
        id: dist-tag
        shell: bash
        run: |
          git fetch origin main --depth=1000
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            git fetch origin --depth=1000 '+refs/heads/*:refs/remotes/origin/*'
            BRANCH="$(git branch -r --contains HEAD --format='%(refname:short)' \
              | grep -v 'origin/main$' | head -1 | sed 's#^origin/##')"
            if [[ "$BRANCH" =~ ^([0-9]+\.[0-9]+)\.x$ ]]; then
              echo "tag=${BASH_REMATCH[1]}-lts" >> "$GITHUB_OUTPUT"
            else
              echo "tag=legacy" >> "$GITHUB_OUTPUT"
            fi
          fi

      - run: npm publish --provenance --access public --tag ${{ steps.dist-tag.outputs.tag }}