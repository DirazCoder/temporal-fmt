name: Release

# Trigger manually via the UI or automatically on version tags, e.g. v0.3.0
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to mint the OIDC token npm's registry checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm

      # npm 11.5.1+ has native trusted-publishing support (no NPM_TOKEN needed).
      # setup-node's bundled npm can lag behind, so pin explicitly.
      - run: npm install -g npm@latest
      - run: npm --version

      - run: npm ci

      # sanity check: tag version must match package.json, or publish fails loudly
      # instead of shipping a mismatched release
      - name: Verify tag matches package.json version
        run: |
          # Skip check if manually triggered on a branch instead of a tag
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "Manual trigger detected on branch: ${GITHUB_REF}. Skipping tag matching verification."
            exit 0
          fi

          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm run build
      - run: npm test

      # A tag pushed on main (the current line) publishes as "latest", same as
      # always. A tag pushed on an old-line branch (e.g. 0.6.x) must NOT get
      # "latest" — npm compares version numbers and would refuse anyway once a
      # newer version already exists, but we want a real, usable dist-tag for
      # people pinned to that old line, not a failed publish. Fetch main so we
      # can check "does main contain this commit" — checkout@v4 is shallow and
      # only fetches the ref being built, so main isn't available otherwise.
      - name: Determine npm dist-tag
        id: dist-tag
        shell: bash
        run: |
          git fetch origin main --depth=1000
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            # On a tag push, GITHUB_REF is refs/tags/vX.Y.Z, not a branch —
            # so find which branch(es) actually contain this commit instead.
            git fetch origin --depth=1000 '+refs/heads/*:refs/remotes/origin/*'
            BRANCH="$(git branch -r --contains HEAD --format='%(refname:short)' \
              | grep -v 'origin/main$' | head -1 | sed 's#^origin/##')"
            # e.g. 0.6.x -> 0.6-lts. Falls back to "legacy" if we can't find a
            # branch with the expected X.Y.x shape (e.g. workflow_dispatch off
            # an unusually named branch).
            if [[ "$BRANCH" =~ ^([0-9]+\.[0-9]+)\.x$ ]]; then
              echo "tag=${BASH_REMATCH[1]}-lts" >> "$GITHUB_OUTPUT"
            else
              echo "tag=legacy" >> "$GITHUB_OUTPUT"
            fi
          fi

      - run: npm publish --provenance --access public --tag ${{ steps.dist-tag.outputs.tag }}