name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  actions: read

jobs:
  check-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fail if CI workflow did not succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          ENDPOINT="repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=100"
          STARTED_AT=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            STARTED_AT=$(date -u -d '1 minute ago' +%s)
            echo "Dispatching CI workflow for ${{ github.ref_name }} (${SHA})..."
            gh workflow run ci.yml --ref "${{ github.ref_name }}"
          fi

          # The commit may race CI: workflow runs can take a few seconds to
          # become visible after the tag or manual release starts. Poll the
          # CI workflow itself instead of individual check-runs. Reading the
          # workflow run conclusion waits until every CI matrix job and every
          # Playwright browser job has completed.
          for attempt in $(seq 1 120); do
            RUNS=$(gh api "$ENDPOINT")

            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              EXPECTED_EVENT="workflow_dispatch"
            else
              EXPECTED_EVENT="push"
            fi

            if [ -n "$STARTED_AT" ]; then
              COUNT=$(echo "$RUNS" | jq --arg event "$EXPECTED_EVENT" --argjson started "$STARTED_AT" \
                '[.workflow_runs[] | select(.event == $event and (.created_at | fromdateiso8601) >= $started)] | length')
            else
              COUNT=$(echo "$RUNS" | jq --arg event "$EXPECTED_EVENT" \
                '[.workflow_runs[] | select(.event == $event)] | length')
            fi
            if [ "$COUNT" -eq 0 ]; then
              echo "CI workflow run not found yet (attempt ${attempt}/120)..."
              sleep 30
              continue
            fi

            if [ -n "$STARTED_AT" ]; then
              ACTIVE=$(echo "$RUNS" | jq --arg event "$EXPECTED_EVENT" --argjson started "$STARTED_AT" \
                '[.workflow_runs[] |
                  select(.event == $event and (.created_at | fromdateiso8601) >= $started and .status != "completed")] | length')
              CONCLUSION=$(echo "$RUNS" | jq -r --arg event "$EXPECTED_EVENT" --argjson started "$STARTED_AT" '
                [.workflow_runs[] |
                  select(.event == $event and (.created_at | fromdateiso8601) >= $started and .status == "completed")]
                | sort_by(.created_at)
                | if length == 0 then "not_found"
                  else (last | .conclusion // "unknown")
                  end')
            else
              ACTIVE=$(echo "$RUNS" | jq --arg event "$EXPECTED_EVENT" \
                '[.workflow_runs[] |
                  select(.event == $event and .status != "completed")] | length')
              CONCLUSION=$(echo "$RUNS" | jq -r --arg event "$EXPECTED_EVENT" '
                [.workflow_runs[] |
                  select(.event == $event and .status == "completed")]
                | sort_by(.created_at)
                | if length == 0 then "not_found"
                  else (last | .conclusion // "unknown")
                  end')
            fi
            if [ "$ACTIVE" -gt 0 ]; then
              echo "CI workflow is still running (attempt ${attempt}/120)..."
              sleep 30
              continue
            fi

            echo "CI conclusion: $CONCLUSION"
            if [ "$CONCLUSION" != "success" ]; then
              echo "CI workflow did not succeed (got: $CONCLUSION). Blocking release."
              exit 1
            fi

            echo "CI workflow completed successfully."
            exit 0
          done

          echo "Timed out waiting for CI workflow run. Blocking release."
          exit 1

  publish:
    needs: check-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC token verification on npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm --version

      - run: npm ci

      # Fails fast if the git tag doesn't match package.json to prevent mismatched releases
      - name: Verify tag matches package.json version
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "Manual trigger detected on branch: ${GITHUB_REF}. Skipping tag matching verification."
            exit 0
          fi

          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm run test:all -- --no-browser

      # Minification disabled for now — Socket.dev's registry scanner flags
      # minified npm packages as a Quality issue regardless of source maps,
      # and the ~20KB saved wasn't worth that hit. The published tarball is
      # now the same unminified build test:all already verified above, so
      # there's nothing left for these two steps to rebuild or check.
      # Uncomment both to go back to publishing a minified build.
      # - run: npm run build:publish
      #
      # - name: Verify the published build is actually minified
      #   run: |
      #     if grep -rlq "function safeParse" dist/chunk-*.js 2>/dev/null; then
      #       echo "dist/ still has readable function names — minification didn't run."
      #       echo "Check TSUP_MINIFY is set in build:publish (package.json) and that"
      #       echo "tsup.config.ts's minify option still reads it correctly."
      #       exit 1
      #     fi

      # Sets 'latest' for main branch builds and tagged LTS tags for older release branches
      - name: Determine npm dist-tag
        id: dist-tag
        shell: bash
        run: |
          git fetch origin main --depth=1000
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            git fetch origin --depth=1000 '+refs/heads/*:refs/remotes/origin/*'
            BRANCH="$(git branch -r --contains HEAD --format='%(refname:short)' \
              | grep -v 'origin/main$' | head -1 | sed 's#^origin/##')"
            if [[ "$BRANCH" =~ ^([0-9]+\.[0-9]+)\.x$ ]]; then
              echo "tag=${BASH_REMATCH[1]}-lts" >> "$GITHUB_OUTPUT"
            else
              echo "tag=legacy" >> "$GITHUB_OUTPUT"
            fi
          fi

      - run: npm publish --provenance --access public --tag ${{ steps.dist-tag.outputs.tag }}
