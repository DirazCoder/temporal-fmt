name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC token verification on npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm --version

      - run: npm ci

      # Fails fast if the git tag doesn't match package.json to prevent mismatched releases
      - name: Verify tag matches package.json version
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "Manual trigger detected on branch: ${GITHUB_REF}. Skipping tag matching verification."
            exit 0
          fi

          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # scripts/semverRange.mjs resolves caret ranges against
      # scripts/versions.json's recorded release order, not by doing
      # arithmetic on the version string — this project's 0.9.x patch
      # numbers don't ship in numeric order (0.9.41 predates 0.9.5), so
      # a stale table means checkVersionRange silently falls back to
      # treating this release as "before the tracked window," which
      # fails every caret range a mod might declare against it. The
      # next two steps catch that before the full test suite runs:
      # first that this exact version is tracked at all, then that the
      # whole table still matches CHANGELOG.md (a version can be
      # present with a wrong date/commit if the changelog was edited
      # after the table was last generated).

      - name: Verify this version is tracked in versions.json
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if ! node -e "
            const v = require('./scripts/versions.json');
            const known = v.releases.some(r => r.version === process.argv[1]);
            process.exit(known ? 0 : 1);
          " "$PKG_VERSION"; then
            echo "Version $PKG_VERSION isn't in scripts/versions.json."
            echo "Add a '## $PKG_VERSION — <date> (\`<commit>\`)' heading to CHANGELOG.md,"
            echo "then run 'node scripts/generateVersionTable.mjs' and commit the result."
            exit 1
          fi

      - run: node scripts/generateVersionTable.mjs

      - name: Verify versions.json is up to date with CHANGELOG.md
        run: |
          if ! git diff --quiet -- scripts/versions.json; then
            echo "scripts/versions.json is out of date with CHANGELOG.md."
            echo "Run 'node scripts/generateVersionTable.mjs' and commit the result before releasing."
            git diff -- scripts/versions.json
            exit 1
          fi

      - run: npm run test:all

      # Minification disabled for now — Socket.dev's registry scanner flags
      # minified npm packages as a Quality issue regardless of source maps,
      # and the ~20KB saved wasn't worth that hit. The published tarball is
      # now the same unminified build test:all already verified above, so
      # there's nothing left for these two steps to rebuild or check.
      # Uncomment both to go back to publishing a minified build.
      # - run: npm run build:publish
      #
      # - name: Verify the published build is actually minified
      #   run: |
      #     if grep -rlq "function safeParse" dist/chunk-*.js 2>/dev/null; then
      #       echo "dist/ still has readable function names — minification didn't run."
      #       echo "Check TSUP_MINIFY is set in build:publish (package.json) and that"
      #       echo "tsup.config.ts's minify option still reads it correctly."
      #       exit 1
      #     fi

      # Sets 'latest' for main branch builds and tagged LTS tags for older release branches
      - name: Determine npm dist-tag
        id: dist-tag
        shell: bash
        run: |
          git fetch origin main --depth=1000
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            git fetch origin --depth=1000 '+refs/heads/*:refs/remotes/origin/*'
            BRANCH="$(git branch -r --contains HEAD --format='%(refname:short)' \
              | grep -v 'origin/main$' | head -1 | sed 's#^origin/##')"
            if [[ "$BRANCH" =~ ^([0-9]+\.[0-9]+)\.x$ ]]; then
              echo "tag=${BASH_REMATCH[1]}-lts" >> "$GITHUB_OUTPUT"
            else
              echo "tag=legacy" >> "$GITHUB_OUTPUT"
            fi
          fi

      - run: npm publish --provenance --access public --tag ${{ steps.dist-tag.outputs.tag }}